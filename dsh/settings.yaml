ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-default-model:
  provider: deepseek-official
  model: deepseek-v4-pro
  reasoningEffort: max
llm-pi-ai:
  providers:
    zai-coding-cn:
      apiKeyEnv: ZAI_CODING_CN_API_KEY
      # GLM-5.3 尚未进入本机捆绑目录（pi-ai 0.82.1），故手动声明模型列表。
      # models 是整体替换：前六个照抄内置目录以保留其元数据，最后追加 glm-5.3。
      models:
        - id: glm-4.5-air
        - id: glm-4.7
        - id: glm-5-turbo
        - id: glm-5.1
        - id: glm-5.2
        - id: glm-5v-turbo
        - id: glm-5.3
          contextWindow: 1000000
          maxTokens: 131072
          # 目录外模型 glm-5.3 的字段，照抄 pi-ai 0.84.2 官方目录条目；
      # 注意 zaiToolStream 是厂商专属键，写在用户配置里会被拒绝，故省略。
      # contextWindow/maxTokens 必须显式声明：本机 pi-ai 0.82.1 目录没有此模型，
      # 不写会落到 defaultContextWindow=262144（256K）兜底，导致压缩提前触发。
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        supportsReasoningEffort: false
        maxTokensField: max_tokens
        thinkingFormat: zai
# Web 终端字体：Nerd Font 图标 + 中文兜底（better-sidebar 底部终端 / dsh-ssh SSH 终端）
dsh-better-sidebar:
  terminalFontFamily: "Hack Nerd Font Mono, PingFang SC, monospace"
dsh-ssh:
  terminalFontFamily: "Hack Nerd Font Mono, PingFang SC, monospace"
pet:
  visible: true
  size: 160
  right: 198
  bottom: 1207
  petId: whale-girl
  enabled: false
