# Periodically open (or refresh) a PR that merges dev into master.
#
# Behavior per run:
#   - dev has no commits ahead of master   -> do nothing
#   - an open dev->master PR already exists -> only refresh its title/body
#   - otherwise                             -> create a new PR
#
# NOTE: GitHub only runs *scheduled* workflows from the default branch, so this
# file must also exist on master before the cron takes effect. Until then it
# can still be triggered manually while only on dev:
#   gh workflow run dev-to-master-pr.yml --ref dev
name: dev-to-master-pr

on:
  schedule:
    - cron: "0 2 * * 1" # every Monday 02:00 UTC (10:00 Beijing)
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dev-to-master-pr
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0 # full history: needed to diff against master

      - name: Count commits on dev that are not in master yet
        id: ahead
        run: |
          git fetch origin master
          AHEAD=$(git rev-list --count origin/master..dev)
          echo "ahead=$AHEAD" >>"$GITHUB_OUTPUT"
          echo "dev is ${AHEAD} commit(s) ahead of master" >>"$GITHUB_STEP_SUMMARY"

      - name: Render PR title and body
        if: steps.ahead.outputs.ahead != '0'
        id: render
        run: |
          AHEAD=$(git rev-list --count origin/master..dev)
          FIRST=$(git log --format=%cs origin/master..dev | tail -1) # oldest new commit
          LAST=$(git log -1 --format=%cs origin/master..dev)         # newest commit
          echo "title=chore: sync dev -> master (${AHEAD} commits, ${FIRST}..${LAST})" >>"$GITHUB_OUTPUT"

          {
            echo "Auto-generated by the dev-to-master-pr workflow; this description is refreshed on every run while the PR stays open."
            echo
            echo "## Commits on dev not yet in master (${AHEAD})"
            echo
            git log --reverse --format='- %h %s' origin/master..dev | head -100
            if [ "$AHEAD" -gt 100 ]; then
              echo "- ... (list truncated at 100 commits)"
            fi
            echo
            echo "## Diffstat (merge-base..dev)"
            echo
            echo '```'
            git diff --stat origin/master...dev | head -50
            echo '```'
          } >pr-body.md

          cat pr-body.md >>"$GITHUB_STEP_SUMMARY"

      - name: Create or refresh the dev -> master PR
        if: steps.ahead.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.render.outputs.title }}
        run: |
          PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --base master --head dev \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            echo "Open PR #$PR_NUMBER already exists -> refreshing title/body only"
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file pr-body.md
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base master --head dev \
              --title "$TITLE" --body-file pr-body.md
          fi
