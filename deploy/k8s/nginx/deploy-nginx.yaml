apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
  labels:
    app: nginx
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: nginx
      nodePort: 30080
  selector:
    app: nginx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-singleton
  labels:
    app: nginx
spec:
  selector:
    matchLabels:
      app: nginx
  replicas: 1
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx-singleton
          image: nginx:latest
          resources:
            requests:
              cpu: 1000m
              memory: 1024Mi
          # command:
          #   - nginx
          #   - -c
          #   - /etc/nginx/nginx.conf
          ports:
            - containerPort: 80
              name: nginx
          volumeMounts:
            # - name: nginx-config
            #   mountPath: /etc/nginx/nginx.conf
            #   subPath: nginx.conf
            - name: nginx-storage
              mountPath: /var/log/nginx
      volumes:
        - name: nginx-storage
          emptyDir: {}
        # - name: nginx-config
        #   configMap:
        #     name: nginx-config
        #     items:
        #       - key: nginx.conf
        #         path: nginx.conf
