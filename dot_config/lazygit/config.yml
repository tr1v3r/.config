confirmonquit: false
git:
  branchLogCmd: "git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium --oneline {{branchName}} --"
  autofetch: true
  merging:
    manualcommit: false
  skiphookprefix: WIP
  diffRenderers:
    - colorArg: always
      # for lazygit-edit: in many cases lazygit will be able to guess the right preset from your $(git config core.editor), or an environment variable such as $VISUAL or $EDITOR.
      command: delta --dark --paging=never --24-bit-color=always --features=tokyonight-night --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
gui:
  commitlength:
    show: true
  mouseevents: false
  scrollheight: 2
  scrollpastbottom: true
  # Tokyo Night (night variant)
  theme:
    lightTheme: false
    activeBorderColor:
      - "#7aa2f7"
      - bold
    inactiveBorderColor:
      - "#27a1b9"
    searchingActiveBorderColor:
      - "#7aa2f7"
      - bold
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - "#283457"
    selectedRangeBgColor:
      - "#283457"
    cherryPickedCommitFgColor:
      - "#7aa2f7"
    cherryPickedCommitBgColor:
      - "#bb9af7"
    markedBaseCommitFgColor:
      - "#7aa2f7"
    markedBaseCommitBgColor:
      - "#e0af68"
    unstagedChangesColor:
      - "#db4b4b"
    defaultFgColor:
      - "#c0caf5"
reporting: "off"
splashupdatesindex: 0
startuppopupversion: 1
keybinding:
  universal:
    quit-alt1: "<esc>"
    prevItem-alt: "u"
    nextItem-alt: "e"
    prevBlock-alt: "n"
    nextBlock-alt: "i"
    nextMatch: "="
    prevMatch: "-"
    startSearch: /
    new: "k"
    edit: "o"
    openFile: "O"
    scrollUpMain-alt1: "U"
    scrollDownMain-alt1: "E"
    scrollUpMain-alt2: "<c-u>"
    scrollDownMain-alt2: "<c-e>"
    undo: "l"
    redo: "<c-r>"
    diffingMenu: "M"
    filteringMenu: "<c-f>"
  files:
    ignoreFile: "I"
  commits:
    moveDownCommit: "<c-e>"
    moveUpCommit: "<c-u>"
    startInteractiveRebase: "I"
  branches:
    viewGitFlowOptions: "I"
    setUpstream: "U"
    forceCheckoutBranch: <disabled>
customCommands: # docs: https://github.com/jesseduffield/lazygit/blob/master/docs/Custom_Command_Keybindings.md
  - key: "F"
    context: "global"
    description: "Fetch and Prune"
    command: "git fetch -p"
    loadingText: "Fetching and pruning remote branches..."
    output: log
  - key: "n"
    context: "localBranches"
    prompts:
      - type: "menu"
        title: "What kind of branch is it?"
        key: "BranchType"
        options:
          - name: "feature"
            description: "a feature branch"
            value: "feature"
          - name: "hotfix"
            description: "a hotfix branch"
            value: "hotfix"
          - name: "release"
            description: "a release branch"
            value: "release"
      - type: "input"
        title: "What is the new branch name?"
        key: "BranchName"
        initialValue: ""
    command: "git flow {{.Form.BranchType}} start {{.Form.BranchName}}"
    loadingText: "Creating branch"
  - key: "G"
    description: "Open remote repository"
    # command: "echo {{.Form.RemoteRepo | quote}}"
    command: "open https://`echo {{.Form.RemoteRepo}} | sed 's/:/\\//g'`"
    context: "global"
    prompts:
      - type: "menuFromCommand"
        title: "Visit Remote Repository:"
        key: "RemoteRepo"
        command: "git remote -v"
        filter: "^([^\\s]+)\\s+git@(.*)\\.git \\((.*)\\)$"
        valueFormat: "{{ .group_2 }}"
        labelFormat: "{{.group_1 | cyan}} ({{.group_3 }}) {{ .group_2 }}"
