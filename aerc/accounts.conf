# =============================================================================
# aerc account configuration
#
# CREDENTIAL STRATEGY: No passwords in this file.
# Uses `source-cred-cmd` / `outgoing-cred-cmd` to fetch credentials from
# 1Password CLI at connection time via the helper script from the private
# submodule at ~/.config/secrets/aerc/cred-cmd.sh.
#
# Each 1Password item stores: username (email address), password (app password).
# =============================================================================

# ---- Gmail: Google-Acrux (acrux.hu@gmail.com) ----
#
# Prerequisites:
#   1. Enable 2FA on Google Account
#   2. Generate an App Password at https://myaccount.google.com/apppasswords
#   3. Store the App Password in 1Password item "Google-Acrux" → password field
#
[Google-Acrux]
source            = imaps://acrux.hu%40gmail.com@imap.gmail.com:993
outgoing          = smtps://acrux.hu%40gmail.com@smtp.gmail.com:465
source-cred-cmd   = sh ~/.config/secrets/aerc/cred-cmd.sh Google-Acrux
outgoing-cred-cmd = sh ~/.config/secrets/aerc/cred-cmd.sh Google-Acrux
default           = INBOX
from              = Acrux <acrux.hu@gmail.com>
copy-to           = [Gmail]/Sent Mail
sort              = -r date


# ---- GMX (tr1v3r@gmx.com) ----
#
# Prerequisites:
#   1. GMX may require enabling IMAP/POP3 in webmail settings first
#   2. App password stored in 1Password item "GMX" → "Thunderbird应用密码" field
#
[GMX]
source            = imaps://tr1v3r%40gmx.com@imap.gmx.com:993
outgoing          = smtp://tr1v3r%40gmx.com@mail.gmx.com:587
source-cred-cmd   = sh ~/.config/secrets/aerc/cred-cmd.sh GMX "apple app password"
outgoing-cred-cmd = sh ~/.config/secrets/aerc/cred-cmd.sh GMX "apple app password"
default           = INBOX
from              = R1v3r <tr1v3r@gmx.com>
copy-to           = Sent
sort              = -r date
