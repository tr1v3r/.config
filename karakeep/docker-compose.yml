# Karakeep — self-hosted bookmark-everything (links/notes/images) with AI tagging,
# full-text search, and web-page archiving. Single compose (web + chrome + meilisearch).
#
# Unlike emby/bt, do NOT add a network_mode: host override — this stack is
# multi-container and the web service resolves `chrome` and `meilisearch` by
# Docker service-name DNS over the bridge network. Host networking would break
# that. The web container publishes 0.0.0.0:3000, which Docker binds to every
# host interface including tailscale0 → reachable at
# http://<server-tailscale-name>:3000 from the MacBook/phone.
#
# Secrets live in .env (git-crypt encrypted). Data is stored in named docker
# volumes (data + meilisearch) — no per-machine path config needed.
#
# Usage:
#   git crypt unlock
#   # fill <server-tailscale-name> in .env
#   docker compose up -d

services:
  web:
    image: ghcr.io/karakeep-app/karakeep:0.32.0
    container_name: karakeep
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data # DON'T CHANGE — internal path inside the container
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
    ports:
      - "3000:3000/tcp" # Web UI on 0.0.0.0:3000 → reachable over Tailscale
    volumes:
      - data:/data # DB + assets (named volume)
  chrome:
    image: gcr.io/zenika-hub/alpine-chrome:124
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    restart: unless-stopped
    env_file:
      - .env # MEILI_MASTER_KEY
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch:/meili_data

volumes:
  data:
  meilisearch:
